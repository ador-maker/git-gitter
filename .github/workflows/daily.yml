name: Daily demo

on:
  schedule:
    # 00:07 UTC daily — offset from :00 to avoid the post-midnight burst.
    # The generator decides whether today is an "active" day (see below).
    - cron: '7 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decide if today is active + generate demos
        # Exits 0 with no output files on inactive days. On active days it
        # creates demos/<date>_*.md. Re-runs the same day are no-ops.
        run: node tools/generate-demo.mjs

      - name: Commit and push (active days only)
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor.id }}+${{ github.actor }}@users.noreply.github.com"

          # Whatever the generator left on disk today is the day's commits.
          # If it's an inactive day, there are no files and this step is a no-op,
          # which is exactly the sporadic pattern we want.
          git add demos/ daily.md
          if git diff --cached --quiet; then
            echo "Nothing to commit (inactive day, or already committed)."
            exit 0
          fi

          # Stage per-file commits so each file is its own commit.
          # Committer date is set to a plausible daytime slot (not 00:07) so
          # the graph reflects when the work would have happened, not when the
          # cron fired. GitHub counts the push day (today), so these still land
          # on today's square.
          HOURS=("08" "11" "14")
          MINUTES=("23" "47" "12")

          DATE=$(date -u +%F)
          i=0
          for f in $(git diff --cached --name-only); do
            git add "$f"
            if git diff --cached --quiet; then continue; fi
            slug=$(basename "$f" .md)
            time="${HOURS[i]:-17}:${MINUTES[i]:-05}"
            GIT_AUTHOR_DATE="$DATE $time:00 +0000" \
            GIT_COMMITTER_DATE="$DATE $time:00 +0000" \
              git commit -m "demo $DATE: $slug"
            i=$((i+1))
          done

          git push
          echo "Pushed for $DATE"
